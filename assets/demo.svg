  <text x="22" y="94" fill="#565f89" font-size="12">after: every token keeps its own, faded</text>
  <text x="22" y="118" xml:space="preserve"><tspan fill="#c8d3f5">result&#160;=&#160;</tspan><tspan fill="#8991a8">data</tspan><tspan fill="#5c6280">&#160;=&#160;</tspan><tspan fill="#5c76ae">json</tspan><tspan fill="#5c6280">.</tspan><tspan fill="#5c76ae">loads</tspan><tspan fill="#5c6280">(</tspan><tspan fill="#8991a8">raw</tspan><tspan fill="#5c6280">)</tspan></text>
  <text x="22" y="162" fill="#565f89" font-size="12">unused code — before</text>
  <text x="22" y="186" xml:space="preserve"><tspan fill="#c8d3f5">&#160;&#160;&#160;&#160;</tspan><tspan fill="#6b7089">for&#160;</tspan><tspan fill="#6b7089">i&#160;</tspan><tspan fill="#6b7089">in&#160;</tspan><tspan fill="#6b7089">range</tspan><tspan fill="#6b7089">(</tspan><tspan fill="#6b7089">10</tspan><tspan fill="#6b7089">):</tspan></text>
  <text x="22" y="216" fill="#565f89" font-size="12">after: keyword, call and number still tell themselves apart</text>
  <text x="22" y="240" xml:space="preserve"><tspan fill="#c8d3f5">&#160;&#160;&#160;&#160;</tspan><tspan fill="#846bae">for&#160;</tspan><tspan fill="#8991a8">i&#160;</tspan><tspan fill="#846bae">in&#160;</tspan><tspan fill="#5c76ae">range</tspan><tspan fill="#5c6280">(</tspan><tspan fill="#ad694f">10</tspan><tspan fill="#5c6280">):</tspan></text>
